<div class="component-root">
    <div class="page-content">
        <div class="footer-root black-white-bg">
            <div class="directory">
                <a [routerLink]="'/directory'">gmewiki.org Directory</a>
            </div>
            <div class="socials">
                <div class="title">
                    Connect with gmewiki.org
                </div>
                <div class="icons">
                    <a href="https://github.com/gmewikiorg/gme-wiki" target="_blank" class="icon-url">
                        <img src="assets/icons/github-logo.png" alt="github" class="icon-image"
                            style="background-color: white;">
                    </a>
                    <a href="https://x.com/gmewiki" target="_blank" class="icon-url">
                        <img src="assets/icons/x-twitter-logo.png" alt="X" class="icon-image"
                            style="border:1px solid white;">
                    </a>
                    <a href="https://www.reddit.com/r/gmewiki/" target="_blank" class="icon-url">
                        <img src="assets/icons/reddit-icon.png" alt="reddit" class="icon-image">
                    </a>
                    <a href="https://bsky.app/profile/gmewiki.bsky.social" target="_blank" class="icon-url">
                        <img src="assets/icons/bluesky-logo.png" alt="Bluesky" class="icon-image">
                    </a>

                </div>
            </div>
            <div class="edit-page-link" >
                    <a [href]="gitHubUrl" class="edit-page-link" class="external-link" target="_blank" style="display:flex;flex-direction: row; align-items: center;">
                        Edit page {{ router.url }}
                        <img src="assets/icons/github-logo.png" alt="github" style="height: 18px; width:18px; background-color: white; margin-left: 5px;">
                    </a>
            </div>



        </div>


        <div class="footer-root-mobile black-white-bg">
            <div class="directory-mobile" style="margin-bottom:20px;">
                <a [routerLink]="'/directory'">gmewiki.org Directory</a>
            </div>
            <div class="socials">
                <div class="title">
                    Connect with gmewiki.org
                </div>
                <div class="icons">
                    <a href="https://github.com/gmewikiorg/gme-wiki" target="_blank" class="icon-url">
                        <img src="assets/icons/github-logo.png" alt="github" class="icon-image"
                            style="background-color: white;">
                    </a>
                    <a href="https://x.com/gmewiki" target="_blank" class="icon-url">
                        <img src="assets/icons/x-twitter-logo.png" alt="X" class="icon-image"
                            style="border:1px solid white;">
                    </a>
                    <a href="https://www.reddit.com/r/gmewiki/" target="_blank" class="icon-url">
                        <img src="assets/icons/reddit-icon.png" alt="reddit" class="icon-image">
                    </a>
                    <a href="https://bsky.app/profile/gmewiki.bsky.social" target="_blank" class="icon-url">
                        <img src="assets/icons/bluesky-logo.png" alt="Bluesky" class="icon-image">
                    </a>

                </div>
            </div>



        </div>
    </div>

</div>
